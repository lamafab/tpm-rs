[package]
name = "clientv2"
version = "0.1.0"
edition = "2021"

[dependencies]
tpm2-rs-base = { workspace = true }
tpm2-rs-marshalable = { workspace = true }
tpm2-rs-errors = { workspace = true, features = ["debug"] }
#
hex = "0.4.3"
hmac = "0.12.1"
rand = "0.9.2"
sha2 = "0.10.9"
rsa = "0.9.8"
# Required for the `rsa` crate, since newer versions require `edition = "2024"`.
base64ct = "=1.7.3"
